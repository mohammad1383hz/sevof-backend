; Sevof queue workers: /etc/supervisor/conf.d/sevof-horizon.conf
; Separate program from seobot's "horizon"; worker counts come from HORIZON_* in .env.
[program:sevof-horizon]
process_name=%(program_name)s
command=/usr/bin/php /var/www/sevof-backend/artisan horizon
directory=/var/www/sevof-backend
autostart=true
autorestart=true
numprocs=1
stopasgroup=true
killasgroup=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/sevof-backend/storage/logs/horizon.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
; Long jobs (up to 900 s) are allowed to finish on restart.
stopwaitsecs=960
