# Stage 1 (temporary): only answers Let's Encrypt challenges for the Sevof names.
# Installed as /etc/nginx/sites-available/sevof, replaced by sevof.conf once the certificate exists.
server {
    listen 80;
    listen [::]:80;
    server_name sevof.com www.sevof.com app.sevof.com api.sevof.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 404;
    }
}
