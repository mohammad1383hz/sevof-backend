# Sevof: /etc/nginx/sites-available/sevof
#   sevof.com, www.sevof.com -> 301 to app.sevof.com (same path)
#   app.sevof.com            -> React panel (static build)
#   api.sevof.com            -> Laravel API (PHP 8.5 FPM, same pool as seobot)
# Certificate: /etc/letsencrypt/live/sevof.com (one cert for all four names, webroot renewal).

# ---------- HTTP: ACME challenges + redirect to HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name sevof.com www.sevof.com app.sevof.com api.sevof.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- sevof.com / www -> app.sevof.com ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sevof.com www.sevof.com;

    ssl_certificate     /etc/letsencrypt/live/sevof.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sevof.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://app.sevof.com$request_uri;
}

# ---------- app.sevof.com: React panel ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.sevof.com;

    ssl_certificate     /etc/letsencrypt/live/sevof.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sevof.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/sevof-front/build;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/sevof-app.access.log;
    error_log  /var/log/nginx/sevof-app.error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Hashed Vite bundles never change: cache for a year.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The plugin zip must always be the latest build.
    location /downloads/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # SPA: every unknown path is the app; index.html is never cached so deploys show at once.
    location / {
        try_files $uri /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}

# ---------- api.sevof.com: Laravel ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.sevof.com;

    ssl_certificate     /etc/letsencrypt/live/sevof.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sevof.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/sevof-backend/public;
    index index.php;
    charset utf-8;

    access_log /var/log/nginx/sevof-api.access.log;
    error_log  /var/log/nginx/sevof-api.error.log warn;

    # Article images arrive as base64 inside JSON.
    client_max_body_size 100M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        # Only Laravel's front controller is executed.
        try_files $uri =404;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Uploaded images (php artisan storage:link): static, never executed.
    location /storage/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
        location ~ \.php$ { deny all; }
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
